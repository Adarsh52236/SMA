services:
  - type: web
    name: sma-crop-yield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MODEL_DIR
        value: models
      - key: MODEL_FILENAME
        value: crop_yield_model.joblib
      - key: METADATA_FILENAME
        value: model_metadata.json
      - key: BACKEND_CORS_ORIGINS
        value: https://sma-frontend.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"
      - key: KEEP_ALIVE_URL
        value: https://sma-crop-yield-api.onrender.com/api/v1/health
